name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build package
        run: npm run build

      - name: Check and publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          echo "Inspecting package: $PACKAGE_NAME (local version: $CURRENT_VERSION)"

          # Check if the exact local version already exists on npm registry
          EXISTS=$(npm view "$PACKAGE_NAME@$CURRENT_VERSION" version 2>/dev/null || true)

          if [ -z "$EXISTS" ]; then
            echo "🚀 Version $CURRENT_VERSION is not yet published on npm."

            if [ -z "$NODE_AUTH_TOKEN" ]; then
              echo "❌ Error: NPM_TOKEN secret is missing or empty. Please add NPM_TOKEN in GitHub repository Secrets."
              exit 1
            fi

            echo "Publishing $PACKAGE_NAME@$CURRENT_VERSION to npm with provenance..."
            npm publish --access public --provenance
            echo "✅ Successfully published $PACKAGE_NAME@$CURRENT_VERSION!"
          else
            echo "ℹ️ Version $CURRENT_VERSION is already published on npm ($EXISTS). Skipping publish."
          fi

